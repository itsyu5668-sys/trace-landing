# Render Blueprint — serves the built Vite app (dist/) via a Node web service.
# See: https://render.com/docs/blueprint-spec
#
# To deploy:
#   1. Push this repo to GitHub (or the git provider Render can read).
#   2. In Render dashboard click "New + > Blueprint" and pick the repo.
#   3. Set the environment variables (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY)
#      on the web service, then deploy.

services:
  - type: web
    name: trace-landing
    runtime: node
    repo: https://github.com/itsyu5668-sys/trace-landing
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: node server.js
    plan: free
    region: oregon
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false